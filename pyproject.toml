[project]
name = "miraa-alternative"
version = "1.0.0"
dependencies = [
    "questionary",
    "base58", "coloredlogs", "requests", "python-dotenv",
    "yt-dlp", "spotipy",
    "lyricsgenius",
    "nagisa",
    "lmdeploy",
    "audio-separator",
    "textual", "opencv-python", "mmengine",
    "torch", "torchvision",
    "gdown",
    "pyperclip",
    "rapidfuzz",
    "lyric-align",

    # force a only windows instasll
    "pywin32 >= 300; platform_system == 'Windows'",
]
requires-python = "=3.12"

[project.scripts]
miraa-alt = "backend_new.cli:main"
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]